name: Publish Docker image

# Runs only after CI has passed on main - a broken image is never published.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        # Uses the automatic, per-run GITHUB_TOKEN - no manual credential
        # setup needed by whoever forks/deploys this repo.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
